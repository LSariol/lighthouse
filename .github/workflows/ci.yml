name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the database integration tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LIGHTHOUSE_TEST_MIGRATOR_DATABASE_URL: postgres://lighthouse_migrator:migrator@localhost:5432/lighthouse_db?sslmode=disable
      LIGHTHOUSE_TEST_DATABASE_URL: postgres://lighthouse_app:app@localhost:5432/lighthouse_db?sslmode=disable
      LIGHTHOUSE_TEST_READER_DATABASE_URL: postgres://lighthouse_reader:reader@localhost:5432/lighthouse_db?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The same Admin setup as on sparkdb, so roles and grants match prod.
      - name: Create roles and database
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d postgres
          -v migrator_password=migrator -v app_password=app -v reader_password=reader
          -f scripts/db/setup.sql

      - name: Test
        run: go test -race -count=1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/lighthouse

      - name: Build the Docker image
        run: docker build -t lighthouse:ci .
