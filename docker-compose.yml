name: lighthouse

services:
  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighthouse
    environment:
      # Plain settings, written out: Lighthouse is deployed by hand, and none
      # of these are secrets.
      - APP_ENV=prod
      - LIGHTHOUSE_VERSION=dev   # set to the release version when releasing
      - COVE_URL=http://cove:2100
      - COVE_TOKEN_PATH=/app/vault/cove/token
      - APP_REPO_PATH=/app/vault/repos.json
      - STAGING_PATH=/app/server/staging/
      - DOWNLOAD_PATH=/app/server/download/
    volumes:
      # Lighthouse's Cove token (written on first start by the bootstrap).
      - type: bind
        source: /srv/server/storage/lighthouse/cove
        target: /app/vault/cove
      # The watchlist. Create it before the first start: echo '[]' > repos.json
      - type: bind
        source: /srv/server/storage/lighthouse/repos.json
        target: /app/vault/repos.json
      # Scratch space, emptied on every deploy.
      - type: bind
        source: /srv/server/staging/
        target: /app/server/staging/
      - type: bind
        source: /srv/server/download/
        target: /app/server/download/
      # Full control of the host's Docker: how Lighthouse deploys projects.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    # No terminal is attached: open the CLI with
    #   docker exec -it lighthouse /lighthouse shell
    restart: unless-stopped
    networks:
      - spark

networks:
  spark:
    external: true
