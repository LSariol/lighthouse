name: lighthouse

# Lighthouse deploys itself from release tags (DOCUMENTATION.md §4.6).
x-lighthouse:
  deploy: releases
  tier: infra

services:
  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighthouse
    environment:
      # No secrets here: Lighthouse reads its own from Cove, and the update helper can't keep any.
      - APP_ENV=prod
      - LIGHTHOUSE_VERSION=${LIGHTHOUSE_DEPLOY_VERSION:-dev}
      - COVE_URL=http://cove:2100
      - COVE_TOKEN_PATH=/app/vault/cove/token
      - STAGING_PATH=/srv/server/staging
      - STORAGE_PATH=/srv/server/storage
      - BACKUP_PATH=/srv/backups
    # Staging, storage and backups are mounted at the same path as on the host.
    volumes:
      - type: bind
        source: /srv/server/storage/lighthouse/cove
        target: /app/vault/cove
      - type: bind
        source: /srv/server/staging
        target: /srv/server/staging
      - type: bind
        source: /srv/server/storage
        target: /srv/server/storage
        read_only: true
      - type: bind
        source: /srv/backups
        target: /srv/backups
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/lighthouse", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Lets a deploy that already swapped finish its check before Lighthouse stops.
    stop_grace_period: 2m
    networks:
      - spark

networks:
  spark:
    external: true
